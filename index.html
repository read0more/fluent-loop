<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      color: #569cd6;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #question {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      background: #2d2d2d;
      color: #d4d4d4;
      outline: none;
    }

    #question:focus {
      border-color: #569cd6;
    }

    #sendBtn {
      padding: 12px 24px;
      font-size: 14px;
      background: #0e639c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #1177bb;
    }

    #sendBtn:disabled {
      background: #3c3c3c;
      cursor: not-allowed;
    }

    .output-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .output-label {
      color: #808080;
      margin-bottom: 8px;
      font-size: 12px;
    }

    #response {
      flex: 1;
      padding: 15px;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      color: #569cd6;
    }

    .error {
      color: #f14c4c;
    }
  </style>
</head>
<body>
  <h1>Claude Code Test</h1>

  <div class="input-area">
    <input type="text" id="question" placeholder="Claude에게 질문하세요..." autofocus>
    <button id="sendBtn">전송</button>
  </div>

  <div class="output-area">
    <div class="output-label">응답:</div>
    <div id="response"></div>
  </div>

  <script>
    const questionInput = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const responseDiv = document.getElementById('response');

    let isLoading = false;

    // 스트리밍 응답 표시
    window.api.onStream((chunk) => {
      responseDiv.textContent += chunk;
      responseDiv.scrollTop = responseDiv.scrollHeight;
    });

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question || isLoading) return;

      isLoading = true;
      sendBtn.disabled = true;
      responseDiv.textContent = '';
      responseDiv.className = 'loading';
      responseDiv.textContent = 'Claude Code 실행 중...\n\n';

      try {
        const result = await window.api.askClaude(question);

        if (!result.success) {
          responseDiv.className = 'error';
          responseDiv.textContent = '오류: ' + result.error;
        } else {
          responseDiv.className = '';
        }
      } catch (err) {
        responseDiv.className = 'error';
        responseDiv.textContent = '오류: ' + (err.error || err.message || '알 수 없는 오류');
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendQuestion);

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendQuestion();
      }
    });
  </script>
</body>
</html>
